name: Build KT WiFi QR 1.6.2 APK
on:
  push:
    branches: [kt-qr-poster-v1]
    paths:
      - 'KT-WIFI-QR-1.6.2-Poster-Android-Project-v5.zip'
      - '.github/workflows/build-kt-wifi-162.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: |
          mkdir -p wifi-project
          unzip -o KT-WIFI-QR-1.6.2-Poster-Android-Project-v5.zip -d wifi-project
      - name: Apply v10 QR, phone and OCR corrections
        run: python3 .github/scripts/patch_v10.py wifi-project
      - name: Validate JavaScript and patch outputs
        run: |
          node --check wifi-project/app/src/main/assets/app.js
          node --check wifi-project/app/src/main/assets/poster.js
          grep -q 'MLKit-full' wifi-project/app/src/main/java/com/hongja/ktwifi/MainActivity.java
      - name: Build APK
        working-directory: wifi-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KT-WIFI-QR-1.6.2-Poster-v10-APK
          path: wifi-project/app/build/outputs/apk/debug/app-debug.apk
