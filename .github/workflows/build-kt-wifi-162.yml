name: Build KT WiFi QR 1.6.2 APK
on:
  push:
    branches: [kt-qr-poster-v1]
    paths:
      - 'KT-WIFI-QR-1.6.2-Poster-Android-Project-v5.zip'
      - '.github/workflows/build-kt-wifi-162.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: |
          mkdir -p wifi-project
          unzip -o KT-WIFI-QR-1.6.2-Poster-Android-Project-v5.zip -d wifi-project
      - name: Apply v6 layout correction
        working-directory: wifi-project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/poster.js')
          s=p.read_text()
          fixes={
            "w*.267":"w*.255",
            "left=w*.511-real/2,top=h*.458-real/2":"left=w*.514-real/2,top=h*.686-real/2",
            "w*.395,h*.812,w*.37":"w*.485,h*.813,w*.31",
            "w*.395,h*.873,w*.37":"w*.485,h*.868,w*.31"
          }
          for before,after in fixes.items():
              if before not in s: raise RuntimeError('Expected v5 layout not found: '+before)
              s=s.replace(before,after)
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: wifi-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KT-WIFI-QR-1.6.2-Poster-v6-APK
          path: wifi-project/app/build/outputs/apk/debug/app-debug.apk
