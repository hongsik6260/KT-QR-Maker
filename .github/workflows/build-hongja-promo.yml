name: Build Hongja WiFi QR Promo APK
on:
  workflow_dispatch:
  push:
    branches:
      - hongja-wifi-qr-1.6.4-promo
    paths:
      - 'KT-WIFI-QR-Android-Project-ready.zip'
      - '.github/workflows/build-hongja-promo.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          test -f KT-WIFI-QR-Android-Project-ready.zip || { echo "Upload KT-WIFI-QR-Android-Project-ready.zip to repository root first"; exit 1; }
          mkdir -p project
          unzip -q KT-WIFI-QR-Android-Project-ready.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Hongja-WiFi-QR-1.6.4-promo-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
