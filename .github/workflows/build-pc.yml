name: Build KT WiFi QR PC
on:
  workflow_dispatch:
  push:
    branches: [kt-qr-poster-v1]
    paths: ['pc/**', '.github/workflows/build-pc.yml']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare KT poster background
        shell: pwsh
        run: |
          Copy-Item "app/src/main/assets/38805-1.png" "pc/kt_background.png"
          if (!(Test-Path "pc/kt_background.png")) { throw "Poster background missing" }
      - name: Install packaging dependencies
        run: python -m pip install pillow qrcode pyinstaller
      - name: Package Windows executable
        run: pyinstaller --noconfirm --onefile --windowed --name KT-WIFI-QR-PC --add-data "pc/kt_background.png;." pc/kt_wifi_qr_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: KT-WIFI-QR-PC-Windows
          path: dist/KT-WIFI-QR-PC.exe
