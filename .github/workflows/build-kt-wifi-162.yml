name: Build KT WiFi QR 1.6.2 APK
on:
  push:
    branches: [kt-qr-poster-v1]
    paths:
      - 'KT-WIFI-QR-1.6.2-Poster-Android-Project-v5.zip'
      - '.github/workflows/build-kt-wifi-162.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: |
          mkdir -p wifi-project
          unzip -o KT-WIFI-QR-1.6.2-Poster-Android-Project-v5.zip -d wifi-project
      - name: Apply v10 QR, phone and OCR corrections
        run: python3 .github/scripts/patch_v10.py wifi-project
      - name: Validate JavaScript and patch outputs
        run: |
          node --check wifi-project/app/src/main/assets/app.js
          node --check wifi-project/app/src/main/assets/poster.js
          grep -q 'MLKit-full' wifi-project/app/src/main/java/com/hongja/ktwifi/MainActivity.java
      - name: Build APK
        working-directory: wifi-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KT-WIFI-QR-1.6.2-Poster-v10-APK
          path: wifi-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare side-by-side v10 test app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wifi-project/app/build.gradle')
          s=p.read_text()
          old="applicationId 'com.hongja.ktwifi'"
          if old not in s: raise RuntimeError('Application ID not found')
          p.write_text(s.replace(old,"applicationId 'com.hongja.ktwifi.testv10'"))
          p=Path('wifi-project/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:name=".MainActivity"','android:name="com.hongja.ktwifi.MainActivity"')
          s=s.replace('android:label="KT WIFI QR생성"','android:label="KT WIFI QR v10"')
          p.write_text(s)
          PY
      - name: Build side-by-side v10 test APK
        working-directory: wifi-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload side-by-side test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KT-WIFI-QR-v10-Test-Install-APK
          path: wifi-project/app/build/outputs/apk/debug/app-debug.apk
