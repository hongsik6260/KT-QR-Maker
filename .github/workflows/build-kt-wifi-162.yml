name: Build KT WiFi QR 1.6.2 v15 APK
on:
  push:
    branches: [kt-qr-poster-v1]
    paths:
      - 'KT-WIFI-QR-1.6.2-Poster-Android-Project-v5.zip'
      - '.github/workflows/build-kt-wifi-162.yml'
      - '.github/scripts/patch_v11.py'
      - '.github/scripts/patch_v12.py'
      - '.github/scripts/patch_v15.py'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack original project
        run: |
          mkdir -p wifi-project
          unzip -o KT-WIFI-QR-1.6.2-Poster-Android-Project-v5.zip -d wifi-project
      - name: Apply existing v11 fixes
        run: python3 .github/scripts/patch_v11.py wifi-project
      - name: Apply v12 OCR and poster corrections
        run: python3 .github/scripts/patch_v12.py wifi-project
      - name: Apply v15 QR and phone corrections
        run: python3 .github/scripts/patch_v15.py wifi-project
      - name: Apply v15 QR and phone corrections
        run: python3 .github/scripts/patch_v15.py wifi-project
      - name: Apply v15 QR and phone alignment
        run: python3 .github/scripts/patch_v15.py wifi-project
      - name: Validate JavaScript and sample OCR parsing
        run: |
          node --check wifi-project/app/src/main/assets/app.js
          node --check wifi-project/app/src/main/assets/poster.js
          grep -q 'KoreanTextRecognizerOptions' wifi-project/app/src/main/java/com/hongja/ktwifi/MainActivity.java
          grep -q 'text-recognition-korean' wifi-project/app/build.gradle
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const s=fs.readFileSync('wifi-project/app/src/main/assets/app.js','utf8');
          const begin=s.indexOf('function parseLabel(text){');
          const end=s.indexOf('function renderPhoto(){',begin);
          assert(begin>=0&&end>begin,'parseLabel section missing');
          const parse=vm.runInNewContext(s.slice(begin,end)+'\nparseLabel');
          const cases=[
            ['암호키 9zd4bxg809','9zd4bxg809'],
            ['암호키: 9zd4bxg809','9zd4bxg809'],
            ['암호키\n9zd4bxg809','9zd4bxg809'],
            ['암호키 9zd4 bxg809','9zd4bxg809'],
            ['무선랜명 KT_GiGA_5G_8E3C\n암호키 9zd4bxg809','9zd4bxg809']
          ];
          for(const [input,expected] of cases)assert.strictEqual(parse(input).password,expected,input);
          assert.strictEqual(parse(cases[4][0]).ssid,'KT_GiGA_5G_8E3C');
          console.log('5 synthetic OCR parser cases passed; real photo OCR not verified.');
          NODE
      - name: Build normal v15 APK
        working-directory: wifi-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload normal APK
        uses: actions/upload-artifact@v4
        with:
          name: KT-WIFI-QR-v15-APK
          path: wifi-project/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare side-by-side v15 test app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wifi-project/app/build.gradle')
          s=p.read_text()
          old="applicationId 'com.hongja.ktwifi'"
          if old not in s: raise RuntimeError('Application ID not found')
          p.write_text(s.replace(old,"applicationId 'com.hongja.ktwifi.testv15'"))
          p=Path('wifi-project/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:name=".MainActivity"','android:name="com.hongja.ktwifi.MainActivity"')
          s=s.replace('android:label="KT WIFI QR생성"','android:label="KT WIFI QR v15"')
          p.write_text(s)
          PY
      - name: Build side-by-side test APK
        working-directory: wifi-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload side-by-side v15 APK
        uses: actions/upload-artifact@v4
        with:
          name: KT-WIFI-QR-v15-Test-Install-APK
          path: wifi-project/app/build/outputs/apk/debug/app-debug.apk
