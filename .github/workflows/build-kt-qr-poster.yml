name: Build KT QR Poster APK
on:
  push:
    branches: [kt-qr-poster-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: |
          mkdir -p poster-project
          unzip -o KT-QR-Poster-v1.0.0-Android-Project.zip -d poster-project
          find poster-project -maxdepth 3 -type f | head -60
      - name: Build APK
        working-directory: poster-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KT-QR-Poster-v1.0.0-apk
          path: poster-project/app/build/outputs/apk/debug/app-debug.apk
